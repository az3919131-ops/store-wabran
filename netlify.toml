# Netlify serves the project page; /app (and /login) send the user to the live Odoo system on Render.
[build]
  publish = "site"

[[redirects]]
  from = "/app"
  to = "https://alwabrn-inventory.onrender.com/odoo/action-alwabrn_warehouse.action_dashboard"
  status = 302
  force = true

[[redirects]]
  from = "/login"
  to = "https://alwabrn-inventory.onrender.com/web/login"
  status = 302
  force = true
