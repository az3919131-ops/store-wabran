# docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: [alw_db:/var/lib/postgresql/data]
    restart: unless-stopped
  odoo:
    build: {context: .., dockerfile: deploy/Dockerfile}
    depends_on: [db]
    ports: ["8069:8069"]
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${DB_PASSWORD}
      DB_NAME: alwabrn
      ALWABRN_SECRET_KEY: ${ALWABRN_SECRET_KEY:?set ALWABRN_SECRET_KEY in .env}
    volumes: [alw_data:/var/lib/odoo]
    restart: unless-stopped
volumes: {alw_db: {}, alw_data: {}}
